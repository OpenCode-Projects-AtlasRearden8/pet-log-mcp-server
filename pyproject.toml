[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-log-mcp-server"
version = "1.0.0"
description = "Local MCP server for household pet care notes: vet history, medication organizers, weight trends, feeding notes, and handoff summaries. Education and organizing only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["mcp", "json-rpc", "pet", "local-first", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pet-log-mcp = "pet_log_mcp.server:main"

[tool.setuptools]
packages = ["pet_log_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
